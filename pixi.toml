# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "ltee-project"
description = "Variant calling on three E. coli samples from the Long-Term Evolution Experiment"
authors = ["Hanzhe Liang <hanzhe.liang@mbzuai.ac.ae>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
# `reproduce` must rebuild every result from the raw data with one command.
download = { cmd = "python scripts/download_data.py", description = "Download the raw data and verify checksums" }
report = { cmd = "quarto render reports/ltee-report.qmd --to html", depends-on = ["download"], description = "Render the LTEE read-quality report" }
reproduce = [{ task = "qc" }, { task = "variant-calling" }, { task = "report" }]

[feature.pipeline]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.pipeline.dependencies]
fastqc = ">=0.13.0,<0.14"
multiqc = ">=1.35,<2"
bwa = ">=0.7.19,<0.8"
samtools = ">=1.25,<2"
bcftools = ">=1.25,<2"
snakemake = ">=9.27.1,<10"
graphviz = ">=14.1.2,<15"
snakefmt = ">=2.1.0,<3"

[feature.pipeline.tasks]
qc = { cmd = "mkdir -p results/qc/fastqc && fastqc --quiet --threads 2 --outdir results/qc/fastqc data/raw/fastq/*.fastq && multiqc --force -o results/qc/multiqc results/qc/fastqc", depends-on = ["download"], description = "FastQC on each FASTQ file, then a MultiQC summary" }
variant-calling = { cmd = "bash scripts/run_variant_calling.sh", depends-on = ["download"], description = "Align, call and filter variants (shell script)" }

[environments]
pipeline = ["pipeline"]

# The macOS package hook splits Quarto paths when the environment path contains a space.
[target.osx.activation.env]
QUARTO_SHARE_PATH = "$CONDA_PREFIX/share/quarto"
QUARTO_CONDA_PREFIX = "$CONDA_PREFIX"
QUARTO_DENO = "$CONDA_PREFIX/bin/deno"
QUARTO_DENO_DOM = "$CONDA_PREFIX/lib/deno_dom.dylib"
QUARTO_PANDOC = "$CONDA_PREFIX/bin/pandoc"
QUARTO_ESBUILD = "$CONDA_PREFIX/bin/esbuild"
QUARTO_TYPST = "$CONDA_PREFIX/bin/typst"
QUARTO_DART_SASS = "$CONDA_PREFIX/bin/sass"
DENO_DOM_PLUGIN = "$CONDA_PREFIX/lib/deno_dom.dylib"
DENO_INSTALL_ROOT = "$CONDA_PREFIX"
